version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      react:
        patterns:
          - "react"
          - "react-dom"
      livekit:
        patterns:
          - "livekit-*"
      firebolt:
        patterns:
          - "@firebolt-dev/*"
      three:
        patterns:
          - "three"
          - "three-mesh-bvh"
          - "@pixiv/three-vrm"
      lint-tooling:
        patterns:
          - "eslint*"
          - "prettier"
          - "@babel/*"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(actions)"
